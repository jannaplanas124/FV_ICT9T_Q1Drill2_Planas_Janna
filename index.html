<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: 'Gill Sans';
            background-color: blanchedalmond;
            margin: 0;
            min-height: auto;
        }
        section{
            display: block;
            margin: auto;
            width: 700px;
            height: auto;
            background-color: rgb(189, 208, 255);
            box-shadow: 0px 3px 10px rgb(0, 0, 0);
            padding: 15px;
        }

        header{
            text-align: center;
        }
        img{
            height: 100px;
            width: 100px;
            display: block;
            margin: auto;
            border-radius: 100%;
        }

        select, input[type="submit"], textarea{
            width:100%;
            border-radius: 5px;}

    </style>
</head>
<body>
    <header>
        <h1>Rate a Movie</h1>
        <img src="https://cdn.pixabay.com/photo/2022/07/17/19/22/movie-7328179_640.png" alt="movie logo">
        <p>Submit a rating and a review about one of the movies.</p>
    </header>
    <br>

    <section>
        <form action="">
            <label for="movie">Select a Movie</label>
            <select id="movie" name="movie">
                <option value="movie 1">The Penthouse: War in Life</option>
                <option value="movie 2">L.DK (2014)</option>
                <option value="movie 3">Train to Busan</option>
            </select>
            <br>

            <label for="Genre">Genre/s</span></label>
            <br>
            <input type="checkbox" id="Genre1" name="genre1">
            <label for="Genre1">Drama</label>
            <input type="checkbox" id="Genre2" name="genre2">
            <label for="Genre2">Romance</label>
            <input type="checkbox" id="Genre3" name="genre3">
            <label for="Genre3">Comedy</label>
            <input type="checkbox" id="Genre4" name="genre4">
            <label for="Genre4">Horror</label>
            <input type="checkbox" id="Genre5" name="genre5">
            <label for="Genre5">Others</label>

            <br> <br>
            <label for="rate"></label>
            <input type="radio" id="rate1" name="rating" value="rate1">
            <label for="rate1">⭐</label>
            <input type="radio" id="rate2" name="rating" value="rate2">
            <label for="rate2">⭐⭐</label>
            <input type="radio" id="rate3" name="rating" value="rate3">
            <label for="rate3">⭐⭐⭐</label>
            <input type="radio" id="rate4" name="rating" value="rate4">
            <label for="rate4">⭐⭐⭐⭐</label>
            <input type="radio" id="rate5" name="rating" value="rate5">
            <label for="rate5">⭐⭐⭐⭐⭐</label>
            <br><br>

            <textarea id="review" name="review" cols="40" rows="4" placeholder="Write your review here..."></textarea>

            <br><br>

            <input type="submit" id="submit" name="submit" value="Submit a Review">
            <br><br>
            For more review tips, click <a href="https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide" target="_blank">here</a>
        </form>
    </section>
</body>
</html>
